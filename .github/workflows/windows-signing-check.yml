name: Verify Windows cloud signing without a release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cage-windows-signing-check
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Lee-xeo/Claude-Cage' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    environment: cage-release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Sign one disposable executable and verify Windows trust
        shell: pwsh
        env:
          CAGE_WINDOWS_SIGNING_PROVIDER: ${{ vars.CAGE_WINDOWS_SIGNING_PROVIDER }}
          CAGE_ESIGNER_USERNAME: ${{ secrets.CAGE_ESIGNER_USERNAME }}
          CAGE_ESIGNER_PASSWORD: ${{ secrets.CAGE_ESIGNER_PASSWORD }}
          CAGE_ESIGNER_CREDENTIAL_ID: ${{ secrets.CAGE_ESIGNER_CREDENTIAL_ID }}
          CAGE_ESIGNER_CERTIFICATE_SERIAL: ${{ vars.CAGE_ESIGNER_CERTIFICATE_SERIAL }}
          CAGE_ESIGNER_TOTP_SECRET: ${{ secrets.CAGE_ESIGNER_TOTP_SECRET }}
        run: ./scripts/check-windows-signing.ps1
      - name: Preserve verification facts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-signing-verification-${{ github.run_id }}
          path: _output/signing-check/result.json
          if-no-files-found: ignore
          retention-days: 14
