name: Website checks
on:
  push:
    paths: ['www/**', '.github/workflows/www.yml']
  pull_request:
    paths: ['www/**', '.github/workflows/www.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci --prefix www
      - run: npm run --prefix www check
      - run: npm run --prefix www build
      - uses: actions/upload-artifact@v4
        with:
          name: cage-website
          path: www/dist
# Publication is separate from CI while the project is private.
# GitHub Pages must not silently expose a private preview.
